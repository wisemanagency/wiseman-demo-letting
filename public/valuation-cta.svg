<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Free property valuation illustration">
  <defs>
    <linearGradient id="ctaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ee7c1d" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f3a35c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#faf3e8" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="ctaGlow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ctaBg)"/>
  <rect width="800" height="600" fill="url(#ctaGlow)"/>

  <!-- Subtle house silhouette, bottom-right -->
  <g transform="translate(440 220)" fill="#ffffff" fill-opacity="0.18">
    <path d="M0 220 L0 110 L130 0 L260 110 L260 220 Z"/>
    <rect x="100" y="140" width="60" height="80" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="40" y="140" width="40" height="40" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="180" y="140" width="40" height="40" fill="#ffffff" fill-opacity="0.28"/>
  </g>

  <!-- Key icon, foreground left -->
  <g transform="translate(140 230)" fill="#ffffff" fill-opacity="0.95">
    <circle cx="55" cy="55" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="14"/>
    <rect x="92" y="48" width="170" height="14" rx="3"/>
    <rect x="225" y="48" width="14" height="34"/>
    <rect x="200" y="48" width="14" height="24"/>
    <rect x="172" y="48" width="10" height="22"/>
  </g>

  <!-- Tagline -->
  <text x="140" y="380" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    Free, honest valuation
  </text>
  <text x="140" y="418" fill="#ffffff" fill-opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="500">
    Local experts · 48-hour turnaround
  </text>
</svg>